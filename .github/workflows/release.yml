name: Release Signed APK

# Builds a signed release APK and publishes it to GitHub Releases so the app's
# in-app updater can download it directly.
#
# SETUP (one time, in repo Settings -> Secrets and variables -> Actions):
#   CAMPBELL_KEYSTORE_B64  : base64 of your release-key.jks  (run: base64 -w0 release-key.jks)
#   CAMPBELL_KEYSTORE_PWD  : keystore password
#   CAMPBELL_KEYSTORE_ALIAS: key alias (e.g. campbellxgm)
#   CAMPBELL_KEYSTORE_KEY_PWD: key password
#
# Then bump versionName/versionCode in app/build.gradle.kts and either push a
# tag "vX.Y.Z" or run this workflow manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.CAMPBELL_KEYSTORE_B64 }}" | base64 -d > app/release-key.jks

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          CAMPBELL_KEYSTORE_FILE: release-key.jks
          CAMPBELL_KEYSTORE_PWD: ${{ secrets.CAMPBELL_KEYSTORE_PWD }}
          CAMPBELL_KEYSTORE_ALIAS: ${{ secrets.CAMPBELL_KEYSTORE_ALIAS }}
          CAMPBELL_KEYSTORE_KEY_PWD: ${{ secrets.CAMPBELL_KEYSTORE_KEY_PWD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "campbellxgm-flowos-${{ steps.version.outputs.name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: CampbellXGM FlowOS v${{ steps.version.outputs.name }}
          body: |
            Signed release v${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}).

            Tap the APK below to download, or let the app update itself from Settings → App Updates.
          files: campbellxgm-flowos-${{ steps.version.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
